; TasteQuest v3 — firmware ESP8266 NodeMCU (HMIF UNJA × FST Market Day 2026, © Muhammad Aziz Syah Dani 2026)
; Build:  pio run -d firmware            (atau: npm run fw:build)
; Upload: pio run -d firmware -t upload  — HANYA setelah wiring diperiksa (docs/WIRING.md)
; Serial: pio device monitor -d firmware

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  olikraus/U8g2@2.36.18
  bblanchon/ArduinoJson@7.4.3
build_flags = -Wall -Wextra
